<title>中国行程 · 2026年9月</title>
<style>
  :root{
    --paper:#E7EBE7; --card:#FFFFFF; --ink:#1D3330; --ink-2:#41544F;
    --mute:#7A8A85; --line:#D2DAD5; --indigo:#2A4C6B; --indigo-soft:#E4EBF1;
    --turmeric:#B8801C; --turmeric-soft:#F6EEDC; --done:#8FA39C;
    --alert:#A6412C; --tabh:58px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
    padding:14px 18px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .htitle{font-size:19px;font-weight:640;letter-spacing:.2px;margin:0}
  .hsub{font-size:13px;color:var(--mute);margin:2px 0 0}
  .count{text-align:right;line-height:1.15}
  .count b{display:block;font-size:26px;font-weight:680;letter-spacing:-.5px}
  .count span{font-size:11px;color:var(--mute)}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--turmeric);border-radius:2px;transition:width .35s ease}
  .barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}

  main{padding:14px 14px 28px;max-width:640px;margin:0 auto}
  .view{display:none}.view.on{display:block}
  h2.sec{font-size:13px;font-weight:600;color:var(--mute);margin:22px 2px 9px;letter-spacing:.3px}
  h2.sec:first-child{margin-top:2px}
  .sechd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 9px}
  .sechd h2{font-size:13px;font-weight:600;color:var(--mute);margin:0}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font:inherit;font-size:13px;padding:6px 13px;border-radius:16px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
  .chip b{font-weight:600;opacity:.65;margin-left:4px;font-size:11.5px}
  .chip:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

  .day{position:relative;padding-left:46px;padding-bottom:18px}
  .day::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:2px;background:var(--line)}
  .day:last-child::before{display:none}
  .disc{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;font-size:12px;font-weight:650;
    background:var(--card);border:2px solid var(--line);color:var(--ink-2)}
  .disc.part{border-color:var(--turmeric)}
  .disc.full{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .dhead{display:flex;align-items:baseline;gap:8px;min-height:32px;padding-top:4px;flex-wrap:wrap}
  .dhead b{font-size:16px;font-weight:640}
  .dhead span.w{font-size:12px;color:var(--mute)}
  .dtag{font-size:11px;color:var(--indigo);background:var(--indigo-soft);padding:2px 7px;border-radius:9px;font-weight:600}
  .dtag.hot{color:var(--turmeric);background:var(--turmeric-soft)}

  .items{margin-top:8px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .it{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-top:1px solid var(--line);
    cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
  .it:first-child{border-top:0}
  .it:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
  .box{flex:0 0 20px;width:20px;height:20px;margin-top:1px;border-radius:6px;border:1.5px solid #B9C4BF;
    display:grid;place-items:center;transition:background .15s,border-color .15s}
  .box svg{width:12px;height:12px;opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}
  .it.done .box{background:var(--indigo);border-color:var(--indigo)}
  .it.done .box svg{opacity:1;transform:scale(1)}
  .txt{flex:1;min-width:0}
  .tm{font-size:12px;font-weight:640;color:var(--indigo);letter-spacing:.2px}
  .cat{font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:0 5px;margin-left:6px}
  .lb{font-size:15px;line-height:1.42}
  .nt{font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:2px}
  .it.done .lb,.it.done .tm{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
  .it.done .nt{color:#A6B2AD}

  .items.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:none;border:0;border-radius:0;overflow:visible}
  .items.grid .it{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 9px;gap:8px}
  .items.grid .it:first-child{border-top:1px solid var(--line)}
  .items.grid .it.done{background:#F1F4F2}
  .items.grid .lb{font-size:13.5px;line-height:1.35}
  .items.grid .nt,.items.grid .cat{display:none}
  .items.grid .tm{font-size:11px;display:block;margin-bottom:1px}
  .items.grid .box{flex:0 0 18px;width:18px;height:18px;border-radius:5px}
  @media (min-width:520px){.items.grid{grid-template-columns:repeat(3,1fr)}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 3px;font-size:16px;font-weight:640}
  .card p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .meta{font-size:12.5px;color:var(--mute);margin-top:3px}

  .stay{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .stayhd{padding:13px 14px 12px;background:var(--indigo);color:#fff}
  .stayhd b{display:block;font-size:16px;font-weight:640}
  .stayhd span{font-size:12.5px;opacity:.82}
  .nights{float:right;font-size:12px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:10px;font-weight:600}
  .opt{display:flex;gap:11px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;
    text-align:left;font:inherit;color:inherit;background:none;border-left:0;border-right:0;border-bottom:0}
  .opt:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
  .radio{flex:0 0 20px;width:20px;height:20px;margin-top:2px;border-radius:50%;border:1.5px solid #B9C4BF;display:grid;place-items:center}
  .radio i{width:9px;height:9px;border-radius:50%;background:var(--indigo);transform:scale(0);transition:transform .15s}
  .opt.pick .radio{border-color:var(--indigo)}
  .opt.pick .radio i{transform:scale(1)}
  .opt.pick{background:#F4F8F6}
  .oname{font-size:15px;font-weight:600}
  .oaddr{font-size:12.5px;color:var(--mute);margin-top:1px}
  .price{font-size:13.5px;font-weight:640;color:var(--turmeric);margin-top:5px}
  .odist{font-size:13px;color:var(--ink-2);margin-top:4px}
  .warn{font-size:12.5px;color:var(--turmeric);margin-top:4px}

  textarea,input.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font:inherit;font-size:15px;line-height:1.55;color:var(--ink);background:#FCFDFC;resize:none}
  textarea{min-height:88px;overflow:hidden}
  input.f{font-size:14px;padding:9px 11px}
  textarea:focus,input.f:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:transparent}
  textarea::placeholder,input.f::placeholder{color:#AEB9B4}
  .nlab{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
  .nlab b{font-size:15px;font-weight:640}
  .nlab span{font-size:12px;color:var(--mute)}

  .scanbar{display:flex;gap:8px;align-items:stretch;margin-bottom:14px}
  .scanbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--indigo);color:#fff;border:0;border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:640;cursor:pointer}
  .scanbtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .ghost.wide{width:100%;margin-bottom:9px;padding:14px;font-size:15px}
  .cardrow{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
  .thumb{flex:0 0 64px;width:64px;height:64px;border-radius:8px;object-fit:cover;background:#E4E9E6;border:1px solid var(--line)}
  .cfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .crow{display:flex;gap:6px}
  .crow input.f{flex:1;min-width:0}
  .cstat{font-size:11.5px;color:var(--turmeric)}
  .del{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:2px 0;cursor:pointer;text-align:left}
  .zrow{display:flex;gap:9px;padding:8px 0;border-top:1px dashed var(--line)}
  .zrow:first-child{border-top:0}
  .snap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .snap:first-child{border-top:0}
  .snap b{font-size:14px;font-weight:600}
  .snap span{display:block;font-size:12px;color:var(--mute)}
  .snap button{background:none;border:1px solid var(--line);color:var(--indigo);font:inherit;font-size:12.5px;
    padding:5px 12px;border-radius:14px;cursor:pointer;white-space:nowrap}
  .banner{border-radius:12px;padding:13px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
  .banner.red{background:#F7E7E3;border:1px solid #E4C4BC;color:var(--alert)}
  .banner.ok{background:var(--turmeric-soft);border:1px solid #E8D9B4;color:var(--ink-2)}

  .idea{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:11px;margin-bottom:10px}
  .ihead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
  .ihead .when{font-size:11.5px;color:var(--mute)}
  .irow{display:flex;gap:11px;align-items:flex-start}
  .irow textarea{flex:1;min-width:0;min-height:66px}
  .irow img.thumb{cursor:zoom-in}
  .itags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .csel{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:4px 8px;max-width:100%}
  .trashhd{font-size:12.5px;color:var(--mute);cursor:pointer}
  .tag{font-size:11.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);
    background:#FCFDFC;color:var(--mute);cursor:pointer;font:inherit}
  .tag.on{background:var(--turmeric-soft);border-color:#E8D9B4;color:var(--turmeric);font-weight:640}
  .ifoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{background:none;border:0;font:inherit;padding:9px 0 10px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--mute);font-size:11px;cursor:pointer}
  nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--indigo);font-weight:640}
  nav button:focus-visible{outline:2px solid var(--indigo);outline-offset:-3px}
  @media (max-width:400px){nav button{font-size:10px;letter-spacing:-.2px}nav button svg{width:19px;height:19px}}

  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(20,32,29,.92);display:none;
    place-items:center;padding:20px;cursor:zoom-out}
  .lightbox.on{display:grid}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:10px}

  .foldbar{display:block;width:100%;text-align:left;background:var(--card);border:1px dashed var(--line);
    border-radius:12px;padding:12px 14px;margin:14px 0 4px;font:inherit;font-size:13.5px;color:var(--mute);cursor:pointer}
  .foldbar:active{background:var(--indigo-soft)}
  .foldbar b{color:var(--done)}
  .fab{position:fixed;z-index:60;width:56px;height:56px;border-radius:28px;
    background:var(--indigo);color:#fff;border:0;display:grid;place-items:center;
    box-shadow:0 6px 18px rgba(29,51,48,.3);padding:0;
    touch-action:none;cursor:grab;animation:floaty 4.5s ease-in-out infinite;
    left:auto;top:auto;right:34px;bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom))}
  .fab.snap{transition:left .28s cubic-bezier(.2,.8,.3,1),top .28s cubic-bezier(.2,.8,.3,1)}
  .fab.dragging{animation:none;cursor:grabbing;transform:scale(1.06);
    box-shadow:0 12px 28px rgba(29,51,48,.38);transition:none}
  .fab.hide{display:none}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .fab svg{width:27px;height:27px}
  .fab.sq{border-radius:15px;background:var(--turmeric);cursor:pointer;touch-action:auto}
  .fab.sq svg{width:25px;height:25px}
  .pgrp{font-size:13px;font-weight:700;color:var(--ink);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
  .pline{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 8px;cursor:pointer;
    font-size:14px;line-height:1.5}
  .pline:active{background:var(--indigo-soft)}
  .pline .pico{flex:none;color:var(--indigo);font-size:15px;padding-left:4px}
  #promptCard{margin:0 0 12px}
  #promptCard summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #promptCard summary::-webkit-details-marker{display:none}
  #promptCard summary .meta{font-weight:400;font-size:12px;color:var(--mute)}
  .quick{position:fixed;inset:0;z-index:70;display:none}
  .quick.on{display:block}
  .quick .mask{position:absolute;inset:0;background:rgba(20,32,29,.45)}
  .quick .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);
    border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .quick h4{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
  .quick h4 span{font-size:12.5px;color:var(--mute);font-weight:400}
  .qimgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .qimgs img{width:66px;height:66px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
  .qrow{display:flex;gap:8px;margin-top:10px}
  .qrow .ghost{flex:1}

  .mtask{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);
    border-radius:12px;background:var(--card);padding:10px 12px;margin-bottom:8px}
  .mtask .mchk{flex:none;width:22px;height:22px;border-radius:11px;border:2px solid var(--line);
    background:#fff;margin-top:1px;cursor:pointer;padding:0}
  .mtask .mbody{flex:1;min-width:0}
  .mtask .mbody b{font-size:14.5px;display:block}
  .mtask .mbody span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
  .mtask .mtag{flex:none;font-size:11px;color:var(--mute);border:1px solid var(--line);
    border-radius:10px;padding:2px 8px;margin-top:2px}
  .mtask .grip{flex:none;color:var(--mute);font-size:17px;line-height:1;padding:4px 6px;
    cursor:grab;touch-action:none;letter-spacing:1px}
  .mtask .mact{flex:none;font-size:12px;color:var(--indigo);background:none;border:0;
    padding:4px 2px 4px 6px;cursor:pointer}
  .mtask.dim{background:#F5F6F5;border-style:dashed}
  .mtask.dim .mbody b{text-decoration:line-through;color:var(--mute)}
  .mtask.fade{opacity:.3}
  .mghost{position:fixed;z-index:75;pointer-events:none;opacity:.94;
    box-shadow:0 12px 28px rgba(29,51,48,.3);width:calc(100% - 32px);max-width:500px}
  #mtDoneZone{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;
    padding:8px;background:rgba(255,255,255,.45);margin-bottom:16px}
  #mtDoneZone.hot{border-color:var(--indigo);background:var(--indigo-soft)}
  .mempty{font-size:12.5px;color:var(--mute);text-align:center;padding:12px 4px}
  .msync{font-size:11.5px;color:var(--mute)}
  .qsel{width:100%;font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  .addchip{font-size:13px;padding:5px 12px;border-radius:14px;border:1px solid var(--indigo);
    color:var(--indigo);background:var(--indigo-soft);font-weight:640;cursor:pointer}
  .mtday{margin-top:6px}
  .mtday .mtask{background:var(--indigo-soft);border-color:#C9D6E4}

  .duo{display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:start;margin-bottom:16px}
  .vendtabs{display:none;gap:8px;margin-bottom:8px}
  .vrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font:inherit;color:var(--ink)}
  .vrow .vn{font-size:14.5px;font-weight:640;display:block}
  .vrow .vm{font-size:12px;color:var(--mute);display:block;margin-top:1px}
  .vrow.on{border-color:var(--indigo);background:var(--indigo-soft)}
  .vcard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;
    position:sticky;top:70px}
  .vcard h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .vcard p{margin:0 0 8px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
  .vcard p b{display:block;font-size:12px;color:var(--indigo);margin-bottom:2px}
  @media (max-width:720px){
    .duo{grid-template-columns:1fr}
    .vendtabs{display:flex}
    .duo .colR{display:none}
    .duo.showR .colL{display:none}
    .duo.showR .colR{display:block}
    .vcard{position:static}
  }

/* 地图导航：中国地址→高德地图（自动定位、自己选出行方式），海外地址→Google 地图。
   手机上点一下直接跳对应 App / 网页。
   mapBtn = 住宿页用的大按钮；mapChip = 行程页地址条目后面跟的小胶囊（2026-09-11 加） */
function isChinaAddr(addr){
  const clean=String(addr||"").replace(/[（(].*?[)）]/g,"").replace(/\s+/g," ").trim();
  return /[一-龥]/.test(clean) && /(省|市|区|县|路|大道|街|镇|村|号|栋|广场|地铁|街道|新村|花园|站|机场)/.test(clean);
}
function mapHref(addr){
  const clean=String(addr||"").replace(/[（(].*?[)）]/g,"").replace(/\s+/g," ").trim();
  return isChinaAddr(addr)
    ? "https://uri.amap.com/search?keyword="+encodeURIComponent(clean)
    : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(clean);
}
function mapBtn(addr){
  if(!addr||addr==="—") return "";
  return '<a class="ghost wide" href="'+mapHref(addr)+'" target="_blank" rel="noopener"'
    +' style="margin-top:10px;text-decoration:none;display:block;text-align:center">📍 打开地图（'+(isChinaAddr(addr)?"高德":"Google")+'）导航到这个地址</a>';
}
function mapChip(addr){
  if(!addr||addr==="—") return "";
  return '<a class="mapchip" href="'+mapHref(addr)+'" target="_blank" rel="noopener">📍 '+(isChinaAddr(addr)?"高德":"Google")+' 导航</a>';
}

const K_STATE="leetrip.state.v1";
const K_SNAPS="leetrip.snaps.v1";
const K_META ="leetrip.meta.v1";
const MAX_SNAPS=40, MAX_CARDS=40, MAX_IDEAS=60;
const ITAGS=["日式","韩式","中式","泰式","亚洲融合","其他菜系","包装","设备","门头/装修","菜单","其他"];

const LS=(()=>{ try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); return true; }catch(e){ return false; } })();
const AS=(!LS && typeof window!=="undefined" && window.storage) ? window.storage : null;

async function kGet(k){
  if(LS){ return localStorage.getItem(k); }
  if(AS){ try{ const r=await AS.get(k); return r?r.value:null; }catch(e){ return null; } }
  return MEM[k]||null;
}
async function kSet(k,v){
  if(LS){ localStorage.setItem(k,v); return true; }
  if(AS){ try{ return !!(await AS.set(k,v)); }catch(e){ return false; } }
  MEM[k]=v; return true;
}
const MEM={};

let S={done:{},pick:{},notes:{},cards:[],ideas:[]};
let META={created:0,lastExport:0,restores:[]};
let SNAPS=[];
let ready=false, filter="all", hideDone=true, grid=false;   /* 默认折叠已完成：每次打开都只看没做完的 */

function stripImg(st){
  return {done:st.done,pick:st.pick,notes:st.notes,
    cards:(st.cards||[]).map(c=>{const o=Object.assign({},c); o.img=""; return o;}),
    ideas:(st.ideas||[]).map(c=>{const o=Object.assign({},c); o.img=""; return o;})};
}
function sizeOf(st){
  return (Object.keys(st.done||{}).length)+"勾选 · "
    +(Object.values(st.notes||{}).filter(v=>v&&v.trim()).length)+"笔记 · "
    +((st.cards||[]).length)+"名片 · "
    +((st.ideas||[]).length)+"灵感";
}

async function load(){
  try{
    const raw=await kGet(K_STATE);
    if(raw) S=Object.assign({done:{},pick:{},notes:{},cards:[],ideas:[]},JSON.parse(raw));
    if(!Array.isArray(S.cards)) S.cards=[];
    if(!Array.isArray(S.ideas)) S.ideas=[];
  }catch(e){}
  try{ const r=await kGet(K_SNAPS); if(r) SNAPS=JSON.parse(r)||[]; }catch(e){ SNAPS=[]; }
  try{ const m=await kGet(K_META); if(m) META=Object.assign(META,JSON.parse(m)); }catch(e){}
  if(!META.created){ META.created=Date.now(); await kSet(K_META,JSON.stringify(META)); }
  ready=true;
}

let st=null, lastSnap=0;
function save(){
  clearTimeout(st);
  st=setTimeout(async()=>{
    if(!ready) return;
    const ok=await kSet(K_STATE,JSON.stringify(S));
    if(!ok){ toast("存不下了。去「存档」页导出备份，再把几张照片收进回收站"); return; }
    const now=Date.now();
    if(now-lastSnap>5*60*1000){
      lastSnap=now;
      SNAPS.push({t:now,n:sizeOf(S),d:stripImg(S)});
      if(SNAPS.length>MAX_SNAPS) SNAPS=SNAPS.slice(-MAX_SNAPS);
      await kSet(K_SNAPS,JSON.stringify(SNAPS));
      if(document.getElementById("v-safe").classList.contains("on")) renderSafe();
    }
    toast("已保存");
  },500);
}

  const el=document.getElementById("toast");
  el.textContent=m; el.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1800);
}

  ["move","expo","cls","prep","reg","hotel"].forEach(k=>{
    h+='<button class="chip'+(filter===k?" on":"")+'" data-f="'+k+'">'+CATS[k]+'<b>'+(counts[k]||0)+'</b></button>';
  });
  const G=grid?" grid":"";
  h+='</div><div class="sechd"><h2>出发前要办完的事</h2><span style="display:flex;gap:6px;align-items:center">'
    +'<button class="addchip" id="mtAdd">＋ 加事</button>'
    +'<button class="chip'+(grid?" on":"")+'" data-grid="1">'+(grid?"单列":"多列")+'</button>'
    +'<button class="chip'+(!hideDone?" on":"")+'" data-hide="1">'+(hideDone?("显示已完成 "+doneN):"隐藏已完成")+'</button></span></div>';

  const pv=PREP.filter(p=>pass(p[3],p[0]));
  h+= pv.length ? '<div class="items'+G+'">'+pv.map(p=>row(p[0],"",p[1],p[2],p[3])).join("")+'</div>'
                : '<div class="empty">这一类的出发前事项都做完了</div>';

  h+='<div id="mtWrap"></div>';

  h+='<h2 class="sec">逐日行程</h2>';
  let shown=0;
  DAYS.forEach(d=>{
    const vis=d.items.filter(i=>pass(i[4],i[0]));
    if(!vis.length) return;
    shown++;
    const ids=d.items.map(i=>i[0]);
    const done=ids.filter(i=>S.done[i]).length;
    const cls=done===0?"":(done===ids.length?"full":"part");
    h+='<div class="day"><span class="disc '+cls+' num">'+(done===ids.length?"✓":d.d.split("/")[1])+'</span>'
      +'<div class="dhead"><b class="num">'+d.d+'</b><span class="w">'+d.w+'</span>'
      +'<span class="dtag'+(d.hot?" hot":"")+'">'+esc(d.tag)+'</span>'
      +'<button class="addchip" data-dayadd="'+d.d+'" style="margin-left:auto">＋</button></div>'
      +(QRDAY[d.d]?qrCard(QRDAY[d.d]):"")
      +'<div class="items'+G+'">'+vis.map(i=>row(i[0],i[1],i[2],i[3],i[4])+(i[5]?mapChip(i[5]):"")).join("")+'</div>'
      +'<div class="mtday" data-mtday="'+d.d+'"></div></div>';
  });
  if(!shown) h+='<div class="empty">这一类没有剩下的事了</div>';
  if(hideDone&&doneN>0){
    h+='<button class="foldbar" data-hide="1"><b>✓ 已完成 '+doneN+' 项</b>　已折叠　·　点开显示 / 取消打勾</button>';
  }else if(!hideDone&&doneN>0){
    h+='<button class="foldbar" data-hide="1"><b>✓ 已完成 '+doneN+' 项</b>　·　点这里重新折叠</button>';
  }
  document.getElementById("v-trip").innerHTML=h;
  renderMyTasks();
}

const EXPO_KEY="wb-expo-checklist-v1";
let expoDone={};
try{ expoDone=JSON.parse(localStorage.getItem(EXPO_KEY)||"{}")||{}; }catch(e){ expoDone={}; }
function expoSave(){ try{ localStorage.setItem(EXPO_KEY,JSON.stringify(expoDone)); }catch(e){} }
function expoIsOn(g,it,i){ const k=g.id+"-"+i; return expoDone[k]===undefined ? !!it.def : !!expoDone[k]; }
function expoToggle(cb){
  expoDone[cb.id]=cb.checked; expoSave();
  cb.closest(".xcheck").classList.toggle("on",cb.checked);
  let total=0,ok=0;
  EXPO_GROUPS.forEach(g=>g.items.forEach((it,i)=>{ total++; if(expoIsOn(g,it,i)) ok++; }));
  const bar=document.getElementById("expoBar"); if(bar) bar.style.width=(total?Math.round(ok/total*100):0)+"%";
  const lab=document.getElementById("expoCnt"); if(lab) lab.textContent=ok+" / "+total+" 项已勾";
}
function expoReset(){
  expoDone={}; expoSave(); expoRender(); toast("已清空所有勾选");
}
function expoExport(){
  let out="展会作战清单 · 2026年9月\n（来自「中国行程」App · 展会页）\n";
  EXPO_GROUPS.forEach(g=>{
    out+="\n【"+g.label+"】\n";
    g.items.forEach((it,i)=>{ out+=(expoIsOn(g,it,i)?"[x] ":"[ ] ")+it.t+(it.s?"（"+it.s+"）":"")+"\n"; });
  });
  copyText(out,"已复制展会作战清单，粘到备忘录或发给 Claude");
}
function expoRender(){
  const box=document.getElementById("expoChecklist"); if(!box) return;
  let html="";
  EXPO_GROUPS.forEach(g=>{
    html+='<div class="xgrp"><h4>'+esc(g.label)+' <span class="xcnt" id="xc-'+g.id+'"></span></h4><div class="xitems">';
    g.items.forEach((it,i)=>{
      const id=g.id+"-"+i, on=expoIsOn(g,it,i);
      html+='<label class="xcheck'+(on?" on":"")+'"><input type="checkbox" id="'+id+'"'+(on?" checked":"")
        +' onchange="expoToggle(this)"><span>'+esc(it.t)+(it.s?'<span class="sub">'+esc(it.s)+'</span>':"")+'</span></label>';
    });
    html+='</div></div>';
  });
  box.innerHTML=html;
  EXPO_GROUPS.forEach(g=>{
    let t=g.items.length,o=0; g.items.forEach((it,i)=>{ if(expoIsOn(g,it,i)) o++; });
    const el=document.getElementById("xc-"+g.id); if(el) el.textContent=o+" / "+t;
  });
  let total=0,ok=0;
  EXPO_GROUPS.forEach(g=>g.items.forEach((it,i)=>{ total++; if(expoIsOn(g,it,i)) ok++; }));
  const bar=document.getElementById("expoBar"); if(bar) bar.style.width=(total?Math.round(ok/total*100):0)+"%";
  const lab=document.getElementById("expoCnt"); if(lab) lab.textContent=ok+" / "+total+" 项已勾";
}

function addIdea(img){

  const id="i"+Date.now()+Math.random().toString(36).slice(2,6);
  S.ideas.push({id,ts:Date.now(),img:img||"",txt:"",tag:"",hidden:false});
  return id;
}

const ideaDay=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate();};
function ideaSummaryData(){
  const live=S.ideas.filter(x=>!x.hidden);
  const byTag={}; ITAGS.forEach(t=>byTag[t]=0);
  let untagged=0,withImg=0,withTxt=0; const byDay={};
  live.forEach(x=>{
    if(x.tag&&ITAGS.indexOf(x.tag)>=0) byTag[x.tag]++; else untagged++;
    if(x.img)withImg++; if(x.txt&&x.txt.trim())withTxt++;
    const d=ideaDay(x.ts); byDay[d]=(byDay[d]||0)+1;
  });
  return {live,byTag,untagged,withImg,withTxt,byDay};
}
function ideaBar(label,count,max){
  return '<div class="ibar"><span class="ilab">'+esc(label)+'</span><span class="itrack">'
    +'<i style="width:'+Math.round((count||0)/Math.max(1,max)*100)+'%"></i></span>'
    +'<span class="inum num">'+(count||0)+'</span></div>';
}
function ideaSummaryBody(){
  const D=ideaSummaryData(), live=D.live;
  if(!live.length) return '<p class="meta" style="margin:0">灵感本还是空的，先记几条再来总结。</p>';
  const tags=ITAGS.concat(D.untagged?["未分类"]:[]);
  const cnt={}; ITAGS.forEach(t=>cnt[t]=D.byTag[t]); if(D.untagged) cnt["未分类"]=D.untagged;
  const tmax=Math.max(1,...tags.map(t=>cnt[t]));
  const bars=tags.map(t=>ideaBar(t,cnt[t],tmax)).join("");
  const days=Object.keys(D.byDay).sort();
  const dmax=Math.max(1,...days.map(d=>D.byDay[d]));
  const dbars=days.map(d=>ideaBar(d,D.byDay[d],dmax)).join("");
  let grp="";
  tags.forEach(t=>{
    const arr=live.filter(x=>(x.tag===t)||(t==="未分类"&&!(x.tag&&ITAGS.indexOf(x.tag)>=0)));

    +'<div class="sumkpi"><b class="num">'+live.length+'</b><span>条灵感</span></div>'
    +'<div class="sumkpi"><b class="num">'+D.withImg+'</b><span>带照片</span></div>'
    +'<div class="sumkpi"><b class="num">'+D.withTxt+'</b><span>有文字</span></div></div>'

}

/* ---------- 课堂笔记导出 Excel（纯 JS 生成 .xlsx，照片嵌入表格） ---------- */
const XCT=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=XCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function b64ToU8(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function imgDims(u8){
  try{
    if(u8[0]===0xFF&&u8[1]===0xD8){
      let i=2;
      while(i<u8.length-9){
        if(u8[i]!==0xFF){i++;continue;}
        const m=u8[i+1];
        if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC) return {h:(u8[i+5]<<8)|u8[i+6],w:(u8[i+7]<<8)|u8[i+8]};
        i+=2+((u8[i+2]<<8)|u8[i+3]);
      }
    }else if(u8[0]===0x89&&u8[1]===0x50){
      return {w:((u8[16]<<24|u8[17]<<16|u8[18]<<8|u8[19])>>>0),h:((u8[20]<<24|u8[21]<<16|u8[22]<<8|u8[23])>>>0)};
    }
  }catch(e){}
  return {w:640,h:480};
}
function zipStore(files){
  const enc=new TextEncoder(); const parts=[],central=[]; let off=0;
  const d=new Date();
  const dtime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const ddate=(((d.getFullYear()-1980)&0x7F)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nb=enc.encode(f.name), crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);
    lh.setUint16(10,dtime,true);lh.setUint16(12,ddate,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,f.data.length,true);lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);

function compress(file,maxW,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("读不出这张图"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("图片格式不支持"));
      im.onload=()=>{
        const sc=Math.min(1,maxW/im.width);
        const cv=document.createElement("canvas");
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    +live.map((c,i)=>(i+1)+". 公司："+(c.company||"（未填）")+"｜展台："+(c.booth||"—")+"｜联系人："+(c.person||"—")
      +"｜联系方式："+(c.contact||"—")+"｜品类："+(c.cat||"—")+"｜供货量："+(c.cap||"—")+"｜备注："+(c.note||"—")).join("\n");
}
function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(okMsg),()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");
  ta.value=txt;
  ta.style.cssText="position:fixed;top:8%;left:5%;width:90%;height:64%;z-index:99;font-size:13px;padding:10px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  toast("自动复制没成功，手动全选复制，点别处关闭");
  ta.addEventListener("blur",()=>ta.remove());
}

/* ---------- 备份 ---------- */
function backupBlob(){
  return JSON.stringify({app:"leetrip",build:BUILD,exported:Date.now(),state:S,meta:META},null,1);
}
async function doExport(){
  const txt=backupBlob();
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  const name="行程备份-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+".json";
  try{
    const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    META.lastExport=Date.now(); await kSet(K_META,JSON.stringify(META));
    renderSafe(); toast("已导出，存到 iCloud 或 Dropbox 里");
  }catch(e){ copyText(txt,"下载不支持，已复制成文字"); }
}
async function doImport(file){
  try{
    const txt=await file.text();
    const o=JSON.parse(txt);
    if(!o||!o.state) throw new Error("不是这个 App 的备份文件");
    // 导入前先把当前数据存成存档点，绝不直接覆盖
    SNAPS.push({t:Date.now(),n:"导入前 · "+sizeOf(S),d:stripImg(S)});
    if(SNAPS.length>MAX_SNAPS) SNAPS=SNAPS.slice(-MAX_SNAPS);
    await kSet(K_SNAPS,JSON.stringify(SNAPS));
    S=Object.assign({done:{},pick:{},notes:{},cards:[],ideas:[]},o.state);
    if(!Array.isArray(S.cards)) S.cards=[];
    if(!Array.isArray(S.ideas)) S.ideas=[];
    await kSet(K_STATE,JSON.stringify(S));
    renderTrip(); renderStay(); renderExpo(); renderIdea(); renderNote(); renderSafe(); fillNotes(); updateHead(); mtRefresh();
    toast("已恢复。上一份数据存成了「导入前」存档点");
  }catch(e){ toast("恢复失败："+e.message); }
}
async function restore(i){
  const s=SNAPS[i]; if(!s) return;
  SNAPS.push({t:Date.now(),n:"回滚前 · "+sizeOf(S),d:stripImg(S)});
  if(SNAPS.length>MAX_SNAPS) SNAPS=SNAPS.slice(-MAX_SNAPS);
  await kSet(K_SNAPS,JSON.stringify(SNAPS));
  const imgs={}; S.cards.forEach(c=>{ if(c.img) imgs[c.id]=c.img; });
  S.ideas.forEach(x=>{ if(x.img) imgs[x.id]=x.img; });
  S=Object.assign({done:{},pick:{},notes:{},cards:[],ideas:[]},JSON.parse(JSON.stringify(s.d)));
  S.cards.forEach(c=>{ if(imgs[c.id]) c.img=imgs[c.id]; });
  S.ideas.forEach(x=>{ if(imgs[x.id]) x.img=imgs[x.id]; });
  await kSet(K_STATE,JSON.stringify(S));
  renderTrip(); renderStay(); renderExpo(); renderNote(); renderSafe(); fillNotes(); updateHead();
  toast("已回到 "+fmt(s.t)+"（当前状态也存了一份）");
}

let pendingImgs=[], qTag="", pickTarget="page";
function renderQImgs(){

}

    '<button class="tag'+(qTag===t?" on":"")+'" data-qtag="'+t+'">'+t+'</button>').join("");
}
function qOpen(){
  pendingImgs=[]; qTag=""; pickTarget="quick";
  const ta=document.getElementById("qtxt"); ta.value="";
  renderQImgs(); renderQTags(); quick.classList.add("on");
  setTimeout(()=>ta.focus(),90);

function qClose(){ quick.classList.remove("on"); pickTarget="page"; }
function addIdeaWith(txt,img){
  const id=addIdea(img); if(!id) return false;
  const x=S.ideas.find(i=>i.id===id);
  if(x){ x.txt=txt||""; x.tag=qTag||""; }
  return true;
}
function qSave(){
  const txt=document.getElementById("qtxt").value.trim();
  if(!txt&&!pendingImgs.length){ toast("写一句，或者拍张照"); return; }
  const imgs=pendingImgs.slice();
  let n=0;
  if(!imgs.length){ if(addIdeaWith(txt,"")) n=1; }
  else imgs.forEach((im,i)=>{ if(addIdeaWith(i===0?txt:"",im)) n++; });
  if(!n) return;
  save(); renderIdea(); qClose();
  toast("存进灵感本了（"+n+" 条），去「灵感」页整理");
}
ipicker.addEventListener("change", async e=>{
  const files=[...e.target.files]; ipicker.value="";
  if(!files.length) return;
  for(const f of files){
    let thumb="";
    try{ thumb=await compress(f,420,0.5); }
    catch(err){ toast(err.message); continue; }
    if(pickTarget==="quick"){ pendingImgs.push(thumb); renderQImgs(); }
    else if(pickTarget==="cnote"){
      if(!addCnote(thumb)) return;
      const y=window.scrollY; renderNote(); fillNotes(); window.scrollTo(0,y); save();
    }
    else{
      if(!addIdea(thumb)) return;
      const y=window.scrollY; renderIdea(); fillNotes(); window.scrollTo(0,y); save();
    }
  }
  if(pickTarget!=="quick"&&pickTarget!=="cnote") toast("存好了，写两句再走 —— 光有照片过几天就认不出来了");
});

/* ---------- 我加的事：存资料库数据表，手机和电脑实时同步 ---------- */
const DATABASE_ID="b7pWJF5qPhqUofOD7oqb4p";
const db=(window.__SMART_PAGE__&&window.__SMART_PAGE__.database)||null;
const mtQuick=document.getElementById("mtQuick");
let MY=[], myDeb=null, myBusy=false;

function mtLoad(startCursor,acc,guard){
  acc=acc||[]; guard=guard||0;
  if(guard>100) return Promise.resolve(acc);
  return db.query({databaseId:DATABASE_ID,pageSize:200,startCursor:startCursor,
    sorts:[{property:"排序",direction:"ascending"}]})
    .then(function(r){
      acc=acc.concat(r.results||[]);
      var next=r.nextCursor;
      if(r.hasMore&&next&&next!==startCursor&&(r.results||[]).length)
        return mtLoad(next,acc,guard+1);
      return acc;
    });
}
function mtRefresh(){
  if(!db) return Promise.resolve();
  return mtLoad().then(function(all){ MY=all; renderMyTasks(); })
    .catch(function(err){ console.error("[mt]",err); });
}
function mtCard(x,dimmed){
  if(dimmed){
    return '<div class="mtask dim" data-sp-bindable="database" data-sp-database-id="b7pWJF5qPhqUofOD7oqb4p">'
      +'<span class="mbody"><b>'+esc(x["标题"]||"")+'</b></span>'
      +(x["分类"]?'<span class="mtag">'+esc(x["分类"])+'</span>':"")
      +'<button class="mact" data-mback="'+x._id+'">恢复</button>'
      +'<button class="mact" data-march="'+x._id+'">归档</button></div>';
  }
  return '<div class="mtask" data-sp-bindable="database" data-sp-database-id="b7pWJF5qPhqUofOD7oqb4p">'
    +'<button class="mchk" data-mdone="'+x._id+'" aria-label="标记完成"></button>'
    +'<span class="mbody"><b>'+esc(x["标题"]||"")+'</b>'
    +(x["备注"]?'<span>'+esc(x["备注"])+'</span>':"")+'</span>'
    +(x["分类"]?'<span class="mtag">'+esc(x["分类"])+'</span>':"")
    +'<span class="grip" data-mgrip="'+x._id+'" title="按住拖到下面「已完成」">≡≡</span></div>';
}
function renderMyTasks(){
  const wrap=document.getElementById("mtWrap"); if(!wrap) return;
  if(!db){
    wrap.innerHTML='<div class="sechd"><h2>我加的事</h2><span class="msync">在线同步未连接，请在资料库里打开本页</span></div>';
    return;
  }
  const todo=MY.filter(x=>x["状态"]!=="已完成"&&x["状态"]!=="已归档");
  const done=MY.filter(x=>x["状态"]==="已完成");
  const undated=todo.filter(x=>!x["日期"]);
  const dated=todo.filter(x=>x["日期"]);
  let h='<div class="sechd"><h2>我加的事'+(undated.length?"（"+undated.length+"）":"")+'</h2>'
    +'<span class="msync">存资料库 · 多端同步'+(myBusy?" · 同步中…":"")+'</span></div>';
  if(undated.length){
    h+='<div id="mtList">'+undated.map(function(x){ return mtCard(x,false); }).join("")+'</div>';
  }else{
    h+='<div class="mempty">没挂日期的事在这里；挂了日期的直接出现在逐日行程里</div>';
  }
  h+='<div class="sechd"><h2>已完成（'+done.length+'）</h2>'
    +'<span class="msync">待办拖到这里就标完成，点左边圆圈也行</span></div>'
    +'<div id="mtDoneZone">'
    +(done.length?done.map(function(x){ return mtCard(x,true); }).join("")
      :'<div class="mempty">做完的事拖到这里，或点待办左边的圆圈</div>')
    +'</div>';
  wrap.innerHTML=h;
  /* 挂了日期的条目塞进对应那天 */
  document.querySelectorAll(".mtday").forEach(function(el){
    const d=el.dataset.mtday;
    const items=dated.filter(x=>x["日期"]===d);
    el.innerHTML=items.map(function(x){ return mtCard(x,false); }).join("");
  });
}
function mtSet(id,txt){
  if(!db) return;
  myBusy=true; renderMyTasks();
  db.updateRecord({databaseId:DATABASE_ID,recordId:id,properties:{"状态":{select:txt}}})
    .then(function(){ return mtRefresh(); })
    .catch(function(err){ toast("没存上，检查网络再试"); console.error("[mt]",err); })
    .finally(function(){ myBusy=false; });
}
function mtAddTask(){
  const t=document.getElementById("mtTitle").value.trim();
  if(!t){ toast("先写要办什么"); return; }
  const day=document.getElementById("mtDay").value;
  const props={
    "标题":{text:t},
    "备注":{text:document.getElementById("mtNote").value.trim()},
    "分类":{select:document.getElementById("mtCat").value},
    "状态":{select:"待办"},
    "创建时间":{number:Date.now()},
    "排序":{number:Date.now()}
  };
  if(day) props["日期"]={text:day};
  myBusy=true;
  db.addRecord({databaseId:DATABASE_ID,properties:props}).then(function(){
    mtQuick.classList.remove("on");
    document.getElementById("mtTitle").value="";
    document.getElementById("mtNote").value="";
    toast(day?("加进 "+day+" 了，别的设备刷新就能看见"):"加上了，别的设备刷新就能看见");
    return mtRefresh();
  }).catch(function(err){ toast("没存上，检查网络再试"); console.error("[mt]",err); })
  .finally(function(){ myBusy=false; });
}
function mtOpen(day){
  if(!db){ toast("在线同步没连上，请在资料库里打开本页"); return; }
  const sel=document.getElementById("mtDay");
  sel.innerHTML='<option value="">不挂日期（放在「我加的事」里）</option>'
    +DAYS.map(function(d){ return '<option value="'+d.d+'">'+d.d+' '+d.w+' · '+esc(d.tag)+'</option>'; }).join("");
  if(day) sel.value=day;
  const h4=mtQuick.querySelector("h4");
  h4.childNodes[0].textContent=day?("加一件事到 "+day):"加一件要办的事";
  mtQuick.classList.add("on");
  setTimeout(function(){document.getElementById("mtTitle").focus();},90);
}
if(db&&typeof db.onUpdated==="function"){
  db.onUpdated(function(payload){
    var ids=(payload&&payload.databaseIds)||[];
    if(ids.indexOf(DATABASE_ID)===-1) return;
    clearTimeout(myDeb);
    myDeb=setTimeout(function(){ mtRefresh(); },300);
  });
}

/* 拖拽到「已完成」：按住 ≡≡ 手柄，拖到下面虚线区松手 */
(function(){
  let dragId=null, ghost=null, src=null;
  function zone(){ return document.getElementById("mtDoneZone"); }
  document.addEventListener("pointerdown",e=>{
    const g=e.target.closest("[data-mgrip]"); if(!g) return;
    dragId=g.dataset.mgrip; src=g.closest(".mtask");
    const r=src.getBoundingClientRect();
    ghost=src.cloneNode(true);
    ghost.classList.add("mghost");
    ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px"; ghost.style.width=r.width+"px";
    document.body.appendChild(ghost);
    src.classList.add("fade");
    try{ g.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  document.addEventListener("pointermove",e=>{
    if(!dragId||!ghost) return;
    ghost.style.top=(e.clientY-20)+"px";
    ghost.style.left=Math.max(10,Math.min(e.clientX-40,window.innerWidth-140))+"px";
    const z=zone();
    if(z){
      const zr=z.getBoundingClientRect();
      z.classList.toggle("hot",e.clientY>=zr.top&&e.clientY<=zr.bottom);
    }
  });
  function drop(e){
    if(!dragId) return;
    const z=zone(); let hit=false;
    if(z){
      const zr=z.getBoundingClientRect();
      hit=e.clientY>=zr.top&&e.clientY<=zr.bottom;
    }
    if(hit) mtSet(dragId,"已完成");
    else if(src) src.classList.remove("fade");
    if(z) z.classList.remove("hot");
    if(ghost){ ghost.remove(); ghost=null; }
    src=null; dragId=null;
  }
  document.addEventListener("pointerup",drop);
  document.addEventListener("pointercancel",drop);
})();

/* 悬浮球：随手拖到哪都行，松手自动贴最近的边，位置记住 */
const fab=document.getElementById("fab");
const fab2=document.getElementById("fab2");   /* 方形：展会谈判提示词，永远吊在圆球正下方（2026-09-11） */
const FKEY="wb-fab-pos-v1";
const FABW=56, FABGAP=10, PAD=10;
let fabPos=null;
try{ fabPos=JSON.parse(localStorage.getItem(FKEY)||"null"); }catch(e){ fabPos=null; }
function fabBounds(){
  const tabh=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tabh"))||58;
  return {minX:PAD, maxX:Math.max(PAD,window.innerWidth-FABW-PAD),
    minY:74, maxY:Math.max(74,window.innerHeight-tabh-FABW*2-FABGAP-PAD-26)};
}
function placeFab(p,persist){
  const b=fabBounds();
  const c={x:Math.min(Math.max(b.minX,p.x),b.maxX), y:Math.min(Math.max(b.minY,p.y),b.maxY)};
  fab.style.left=c.x+"px"; fab.style.top=c.y+"px"; fab.style.right="auto"; fab.style.bottom="auto";
  fab2.style.left=c.x+"px"; fab2.style.top=(c.y+FABW+FABGAP)+"px";
  fab2.style.right="auto"; fab2.style.bottom="auto";
  fabPos=c;
  if(persist!==false){ try{ localStorage.setItem(FKEY,JSON.stringify(c)); }catch(e){} }
}
function snapFab(){
  const b=fabBounds();
  const toLeft=(fabPos.x+FABW/2)<window.innerWidth/2;
  fab.classList.add("snap");
  placeFab({x:toLeft?b.minX:b.maxX, y:fabPos.y});
  setTimeout(()=>fab.classList.remove("snap"),320);
}
if(fabPos) placeFab(fabPos,false);
else{ const b=fabBounds(); placeFab({x:b.maxX-18,y:Math.round((b.minY+b.maxY)*0.58)}); }
let fabDrag=null;
fab.addEventListener("pointerdown",e=>{
  const r=fab.getBoundingClientRect();
  fabDrag={dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY,moved:false};
  fab.classList.add("dragging");
  try{ fab.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
fab.addEventListener("pointermove",e=>{
  if(!fabDrag) return;
  if(Math.abs(e.clientX-fabDrag.sx)>6||Math.abs(e.clientY-fabDrag.sy)>6) fabDrag.moved=true;
  placeFab({x:e.clientX-fabDrag.dx,y:e.clientY-fabDrag.dy},false);
});
fab.addEventListener("pointerup",e=>{
  if(!fabDrag) return;
  const moved=fabDrag.moved; fabDrag=null;
  fab.classList.remove("dragging");
  if(moved) snapFab(); else qOpen();
});
fab.addEventListener("pointercancel",()=>{
  if(!fabDrag) return; fabDrag=null; fab.classList.remove("dragging"); snapFab();
});
window.addEventListener("resize",()=>{ if(fabPos) placeFab(fabPos,false); });

    const t="中国行程 2026年9月 费用汇总\n合计：¥"+eNum(tot)+"（≈ €"+eNum(tot/rate)+"，汇率 1€="+rate+"¥）\n\n"
      +ECATS.map(function(c){ return (byCat[c]?(c+"：¥"+eNum(byCat[c])+"\n"):""); }).join("")
      +"\n明细：\n"+list.map(function(x){ return (x.d||"-")+"　"+x.c+"　"+x.n+"　¥"+eNum(+x.a||0); }).join("\n");
    copyText(t,"费用汇总已复制");
  };
  document.querySelectorAll("[data-expdel]").forEach(function(b){
    b.onclick=function(){
      const id=b.getAttribute("data-expdel");
      S.exp=S.exp.filter(function(x){ return x.id!==id; });
      save(); renderExp(); toast("删掉了");
    };
  });
}

/* ---------- 事件 ---------- */
document.addEventListener("click", e=>{
  const zoom=e.target.closest("[data-zoom]");
  if(zoom){
    const x=S.ideas.find(i=>i.id===zoom.dataset.zoom);
    if(x&&x.img){ lightbox.querySelector("img").src=x.img; lightbox.classList.add("on"); }
    return;
  }
  if(e.target.closest("#ipick")){ pickTarget="page"; ipicker.click(); return; }
  if(e.target.closest("#qpic")){ ipicker.click(); return; }
  if(e.target.closest("#qmask")||e.target.closest("#qcancel")){ qClose(); return; }
  if(e.target.closest("#qsave")){ qSave(); return; }
  if(e.target.closest("#fab2")){ pOpen(); return; }
  if(e.target.closest("#pmask")||e.target.closest("#pcancel")){ pClose(); return; }
  if(e.target.closest("#pquick")){ pClose(); qOpen(); return; }
  const pcat=e.target.closest("[data-pcat]");
  if(pcat){ pCat=pcat.dataset.pcat; renderPChips(); document.getElementById("plist").innerHTML=promptListHTML(pCat); return; }
  const pcp=e.target.closest("[data-pcopy]");
  if(pcp){ const pp=pcp.dataset.pcopy.split("|"); copyText(PROMPTS[+pp[0]].items[+pp[1]],"已复制，去微信粘贴或当面照着说"); return; }
  if(e.target.closest("#cpick")){ pickTarget="cnote"; ipicker.click(); return; }
  if(e.target.closest("#cnew")){
    const id=addCnote(""); if(!id) return;
    renderNote(); fillNotes(); save();
    const ta=document.querySelector('textarea[data-cnote="'+id+'"]');
    if(ta){ ta.focus(); ta.scrollIntoView({block:"center"}); }
    return;
  }
  if(e.target.closest("#cxls")){ exportCnotes(); return; }
  const cflt=e.target.closest("[data-cfilter]");
  if(cflt){ cFilter=cflt.dataset.cfilter; renderNote(); fillNotes(); return; }
  const hcn=e.target.closest("[data-hidecnote]");
  if(hcn){ const x=(S.cnotes||[]).find(i=>i.id===hcn.dataset.hidecnote); if(x) x.hidden=true; renderNote(); fillNotes(); save(); toast("删掉了，课程页底部回收站能放回来"); return; }
  const scn=e.target.closest("[data-showcnote]");
  if(scn){ const x=(S.cnotes||[]).find(i=>i.id===scn.dataset.showcnote); if(x) x.hidden=false; renderNote(); fillNotes(); save(); return; }
  const zcn=e.target.closest("[data-zoom2]");
  if(zcn){ const x=(S.cnotes||[]).find(i=>i.id===zcn.dataset.zoom2); if(x&&x.img){ lightbox.querySelector("img").src=x.img; lightbox.classList.add("on"); } return; }
  const qt=e.target.closest("[data-qtag]");
  if(qt){ qTag = qTag===qt.dataset.qtag ? "" : qt.dataset.qtag; renderQTags(); return; }
  const qr=e.target.closest("[data-qrm]");
  if(qr){ pendingImgs.splice(+qr.dataset.qrm,1); renderQImgs(); return; }
  if(e.target.closest("#mtAdd")){ mtOpen(); return; }
  const da=e.target.closest("[data-dayadd]");
  if(da){ mtOpen(da.dataset.dayadd); return; }
  const vv=e.target.closest("[data-vend]");
  if(vv){ vendSel=+vv.dataset.vend; vendTab="R"; renderVend(); return; }
  const vt=e.target.closest("[data-vtab]");
  if(vt){ vendTab=vt.dataset.vtab; renderVend(); return; }
  if(e.target.closest("#vendAsk")){ copyText(vendPrompt(vendQ.trim()),"已复制查询指令，发给 Claude"); return; }
  if(e.target.closest("#mtSave")){ mtAddTask(); return; }
  if(e.target.closest("#mtMask")||e.target.closest("#mtCancel")){ mtQuick.classList.remove("on"); return; }
  const md=e.target.closest("[data-mdone]");
  if(md){ mtSet(md.dataset.mdone,"已完成"); return; }
  const mb=e.target.closest("[data-mback]");
  if(mb){ mtSet(mb.dataset.mback,"待办"); return; }
  const ma=e.target.closest("[data-march]");
  if(ma){ if(confirm("收进归档？页面上不再显示，数据还在资料库里")) mtSet(ma.dataset.march,"已归档"); return; }
  if(e.target.closest("#inew")){
    const id=addIdea(""); if(!id) return;
    renderIdea(); fillNotes(); save();
    const ta=document.querySelector('textarea[data-idea="'+id+'"]');
    if(ta){ ta.focus(); ta.scrollIntoView({block:"center"}); }
    return;
  }
  if(e.target.closest("#iexport")){
    if(!S.ideas.filter(x=>!x.hidden).length){ toast("还没有灵感"); return; }
    copyText(ideaText(),"已复制，粘贴给 Claude"); return;
  }
  if(e.target.closest("#isum")){ ideaSumToggle(); return; }
  if(e.target.closest("#isumExp")){ ideaSummaryExport(); return; }
  const tg=e.target.closest("[data-tag]");
  if(tg){
    const p=tg.dataset.tag.split("|");
    const x=S.ideas.find(i=>i.id===p[0]);
    if(x){ x.tag = x.tag===p[1] ? "" : p[1]; renderIdea(); fillNotes(); save(); }
    return;
  }
  const hi=e.target.closest("[data-hideidea]");
  if(hi){
    const x=S.ideas.find(i=>i.id===hi.dataset.hideidea);
    if(x) x.hidden=true;
    renderIdea(); fillNotes(); save(); toast("收进回收站了，在「存档」页能放回来"); return;
  }
  const si=e.target.closest("[data-showidea]");
  if(si){
    const x=S.ideas.find(i=>i.id===si.dataset.showidea);
    if(x) x.hidden=false;
    renderIdea(); renderSafe(); fillNotes(); save(); return;
  }
  const chip=e.target.closest(".chip[data-f]");
  if(chip){ filter=chip.dataset.f; renderTrip(); window.scrollTo(0,0); return; }
  const hd=e.target.closest(".chip[data-hide]");
  if(hd){ hideDone=!hideDone; renderTrip(); return; }
  const gd=e.target.closest(".chip[data-grid]");
  if(gd){ grid=!grid; renderTrip(); return; }
  if(e.target.closest("#scan")){ picker.click(); return; }
  if(e.target.closest("#manual")){ addBlank(); return; }
  if(e.target.closest("#export")){
    if(!S.cards.filter(c=>!c.hidden).length){ toast("还没有名片"); return; }
    copyText(cardText(),"已复制，粘贴给 Claude"); return;
  }
  if(e.target.closest("#doexport")){ doExport(); return; }
  if(e.target.closest("#docopy")){ copyText(backupBlob(),"已复制，贴进备忘录或邮件发给自己"); return; }
  if(e.target.closest("#doimport")){ importer.click(); return; }
  const rs=e.target.closest("[data-restore]");
  if(rs){ restore(parseInt(rs.dataset.restore,10)); return; }
  const hc=e.target.closest("[data-hidecard]");
  if(hc){ const c=S.cards.find(x=>x.id===hc.dataset.hidecard); if(c)c.hidden=true;
    renderExpo(); fillNotes(); save(); toast("收进回收站了，在「存档」页能放回来"); return; }
  const sc=e.target.closest("[data-showcard]");
  if(sc){ const c=S.cards.find(x=>x.id===sc.dataset.showcard); if(c)c.hidden=false;
    renderExpo(); renderSafe(); fillNotes(); save(); return; }
  const it=e.target.closest(".it");
  if(it){
    const id=it.dataset.id;
    S.done[id]=!S.done[id];
    if(!S.done[id]) delete S.done[id];
    const y=window.scrollY;
    renderTrip(); renderExpo(); fillNotes(); updateHead(); window.scrollTo(0,y); save();
    return;
  }
  const op=e.target.closest(".opt");
  if(op){
    const s=op.dataset.stay, o=op.dataset.opt;
    S.pick[s]=S.pick[s]===o?null:o;
    const y=window.scrollY;
    renderStay(); fillNotes(); window.scrollTo(0,y); save();
  }
});

importer.addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; importer.value="";
  if(f) doImport(f);
});

document.addEventListener("input", e=>{
  const ta=e.target.closest("textarea[data-note]");
  if(ta){ S.notes[ta.dataset.note]=ta.value; grow(ta); save(); return; }
  const cn=e.target.closest("textarea[data-cnote]");
  if(cn){ const x=(S.cnotes||[]).find(i=>i.id===cn.dataset.cnote); if(x){ x.txt=cn.value; grow(cn); save(); } return; }
  const cf=e.target.closest("input[data-cf]");
  if(cf){
    const parts=cf.dataset.cf.split("|");
    const c=S.cards.find(x=>x.id===parts[0]);
    if(c){ c[parts[1]]=cf.value; save(); }
  }
  const ia=e.target.closest("textarea[data-idea]");
  if(ia){
    const x=S.ideas.find(i=>i.id===ia.dataset.idea);
    if(x){ x.txt=ia.value; grow(ia); save(); }
  }
  if(e.target.id==="vendQ"){ vendQ=e.target.value; renderVend(); }
});

document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("v-"+b.dataset.v).classList.add("on");
    if(b.dataset.v==="safe") renderSafe();
    if(b.dataset.v==="idea"){ renderIdea(); fillNotes(); }
    if(b.dataset.v==="exp") renderExp();
    fab.classList.remove("hide");   /* 悬浮球在所有页面都显示：随手记随时能加 */
    window.scrollTo(0,0);
  });
});

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
/* 服务器休眠探测：装了 PWA 之后休眠也照常打开，这里只是告诉你"现在是离线缓存版" */
(function(){
  var shown=false;
  function offlineBar(){
    if(shown||document.getElementById("offbar")) return; shown=true;
    var b=document.createElement("div"); b.id="offbar";
    b.style.cssText="position:sticky;top:0;z-index:900;background:#F6EEDC;color:#7A5A10;"
      +"font-size:12px;line-height:1.5;padding:7px 12px;text-align:center;border-bottom:1px solid #E4D7AE";
    b.innerHTML="服务器在休眠，你看到的是<b>本机缓存版</b>——照常看、照常记，联网后自动同步。";
    document.body.insertBefore(b,document.body.firstChild);
  }
  fetch(location.href,{method:"HEAD",cache:"no-store"})
    .then(function(r){ if(!r||!r.ok) offlineBar(); })
    .catch(offlineBar);
})();

(async()=>{
  await load();
  renderTrip(); renderStay(); renderExpo(); renderIdea(); renderNote(); renderSafe();
  fillNotes(); updateHead(); mtRefresh();
})();
</script>
